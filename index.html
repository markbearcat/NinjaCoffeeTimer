<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Shot Timer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#f2f2f2;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
header b{letter-spacing:.1em;font-size:14px;text-transform:uppercase;color:#aaa}
header button{background:none;border:0;color:#aaa;font-size:14px;padding:8px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px 32px;max-width:520px;width:100%;margin:0 auto}
.v{display:flex;flex-direction:column;gap:24px}
.hide{display:none!important}
.big{width:100%;min-height:96px;border:0;border-radius:24px;font-size:26px;font-weight:600;background:#e8b06a;color:#111}
#goStart{margin-top:12px}
.big.alt{background:#2a2a2a;color:#f2f2f2}
.big.good{background:#6fcf97}.big.bad{background:#eb5757;color:#fff}
.label{color:#888;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:72px;height:72px;border-radius:20px;border:0;background:#2a2a2a;color:#fff;font-size:34px}
.stepper output{flex:1;text-align:center;font-size:64px;font-weight:700}
.chips{display:flex;gap:10px}
.chips button{flex:1;height:64px;border-radius:18px;border:2px solid #2a2a2a;background:none;color:#ddd;font-size:17px}
.chips button.on,.grid button.on{border-color:#e8b06a;color:#e8b06a}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid button{height:56px;border-radius:16px;border:2px solid #2a2a2a;background:none;color:#ddd;font-size:14px;line-height:1.15;padding:4px}
#str button{line-height:1.3;font-size:18px;letter-spacing:.15em}
#str button small{display:block;font-size:12px;color:#888;letter-spacing:0}
.timer{font-size:112px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.sub{text-align:center;color:#999;font-size:18px;min-height:24px}
.card{background:#1c1c1c;border-radius:20px;padding:18px;font-size:17px;line-height:1.45}
.card h3{margin:0 0 8px;font-size:22px}
.card p{margin:10px 0 0}
.sug{background:#2a2216;border:1px solid #e8b06a;border-radius:14px;padding:12px 14px;margin-top:12px}
.note{color:#999;font-size:14px}
.tag{display:inline-block;padding:2px 10px;margin:2px 0;border-radius:99px;font-size:13px;background:#2a2a2a;color:#ccc}
.row{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #222;font-size:15px}
.row small{color:#888;display:block}
.row .r{text-align:right}
.link{background:none;border:0;color:#888;font-size:15px;padding:10px;text-decoration:underline}
input[type=number]{background:#2a2a2a;border:0;color:#fff;border-radius:10px;padding:8px;width:70px;font-size:16px}
</style>
</head>
<body>
<header><b id="title">Shot Timer</b><button id="navBtn">History</button></header>
<main id="main">

<section id="vSetup" class="v">
  <div><div class="label">Coffee</div>
    <div class="grid" id="types">
      <button data-t="Espresso">Espresso</button><button data-t="Quad">Quad</button><button data-t="Long Black">Long Black</button><button data-t="Cold Pressed">Cold Pressed</button>
      <button data-t="Classic">Classic</button><button data-t="Rich">Rich</button><button data-t="Over Ice">Over Ice</button><button data-t="Cold Brew">Cold Brew</button>
    </div></div>
  <div><div class="label">Size</div>
    <div class="chips" id="sizes"><button data-s="Single">Single</button><button data-s="Double">Double</button><button data-s="Luxe">Luxe</button></div></div>
  <div><div class="label">Grind setting</div>
    <div class="stepper"><button id="gMinus">−</button><output id="gVal">10</output><button id="gPlus">+</button></div></div>
  <div><div class="label">Strength</div>
    <div class="chips" id="str">
      <button data-k="1">●<small>4 : 1</small></button>
      <button data-k="2">●●<small>2.5 : 1</small></button>
      <button data-k="3">●●●<small>2 : 1</small></button>
    </div></div>
  <button class="big" id="goStart">Ready</button>
</section>

<section id="vRun" class="v hide">
  <div class="timer" id="clock">0.0</div>
  <div class="sub" id="phase"></div>
  <button class="big" id="runBtn"></button>
  <button class="link" id="cancel">Cancel</button>
</section>

<section id="vResult" class="v hide">
  <div class="card" id="verdict"></div>
  <div class="label" style="margin:0">How did it taste?</div>
  <div class="chips"><button class="big good" id="good" style="min-height:80px">Good</button><button class="big bad" id="bad" style="min-height:80px">Bad</button></div>
</section>

<section id="vAdvice" class="v hide">
  <div class="card" id="advice"></div>
  <div id="tasteQ" class="hide">
    <div class="label">What was wrong?</div>
    <div class="chips"><button id="sour">Sour</button><button id="bitter">Bitter</button><button id="weak">Weak</button></div>
  </div>
  <button class="big" id="done">Save &amp; next</button>
</section>

<section id="vHist" class="v hide">
  <div class="card">
    <div class="label">Target total time (seconds)</div>
    <input type="number" id="tMin" value="24"> to <input type="number" id="tMax" value="32">
    <div class="label" style="margin-top:18px">Grind direction</div>
    <div class="chips"><button id="dirLow">Lower = finer</button><button id="dirHigh">Higher = finer</button></div>
    <p class="note">Ninja Luxe Café: 1–10 finer, 11–25 coarser. Change 1–2 steps at a time.</p>
  </div>
  <div id="list"></div>
  <button class="link" id="csv">Export CSV</button>
  <button class="link" id="clear">Clear history</button>
</section>

</main>
<script>
const $=id=>document.getElementById(id);
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const RATIO={1:4,2:2.5,3:2};
const dots=n=>'●'.repeat(n);
const ratioTxt=n=>RATIO[n]+' : 1';
const BARISTA='If Barista Assist shows a RECOMMENDED number, set the dial to match it before grinding.';
let cfg=store.get('cfg2',{min:24,max:32,lowFine:true});
let log=store.get('log',[]);
let grind=store.get('grind',10),size=store.get('size2','Single'),type=store.get('type','Espresso'),strength=store.get('strength',3);
let shot=null,tick=null,stage=0;

function show(id){document.querySelectorAll('.v').forEach(e=>e.classList.add('hide'));$(id).classList.remove('hide');
  $('navBtn').textContent=id==='vHist'?'Back':'History';}
function setup(){$('gVal').textContent=grind;
  document.querySelectorAll('#sizes button').forEach(b=>b.classList.toggle('on',b.dataset.s===size));
  document.querySelectorAll('#types button').forEach(b=>b.classList.toggle('on',b.dataset.t===type));
  document.querySelectorAll('#str button').forEach(b=>b.classList.toggle('on',+b.dataset.k===strength));}
$('gMinus').onclick=()=>{grind=Math.max(1,grind-1);store.set('grind',grind);setup()};
$('gPlus').onclick=()=>{grind=Math.min(25,grind+1);store.set('grind',grind);setup()};
$('sizes').onclick=e=>{if(e.target.dataset.s){size=e.target.dataset.s;store.set('size2',size);setup()}};
$('types').onclick=e=>{if(e.target.dataset.t){type=e.target.dataset.t;store.set('type',type);setup()}};
$('str').onclick=e=>{const b=e.target.closest('button');if(b){strength=+b.dataset.k;store.set('strength',strength);setup()}};

function startRun(){stage=0;shot={grind,size,type,strength,t0:0,t1:0,t2:0};show('vRun');render();}
function render(){$('runBtn').textContent=stage===0?'Start':stage===1?'Coffee flowing':'Finished';
  $('runBtn').className='big'+(stage===2?' alt':'');
  $('phase').textContent=stage===0?'Press together with the machine':stage===1?'Pre-infusion… tap when coffee appears':'Extracting… tap when it stops';
  if(stage===0)$('clock').textContent='0.0';}
$('goStart').onclick=startRun;
$('runBtn').onclick=()=>{
  const now=performance.now();
  if(stage===0){shot.t0=now;tick=setInterval(()=>{const d=(performance.now()-shot.t0)/1000;$('clock').textContent=d.toFixed(1)},100);stage=1;render();}
  else if(stage===1){shot.t1=now;stage=2;render();}
  else{clearInterval(tick);shot.t2=now;finish();}
};
$('cancel').onclick=()=>{clearInterval(tick);show('vSetup')};

function classify(t){
  if(t<cfg.min-8)return{k:'fast',h:'Very fast',m:'Runs far too quickly — likely under-extracted (sour, watery, weak crema).'};
  if(t<cfg.min)return{k:'fast',h:'A little fast',m:'Slightly under the target range.'};
  if(t<=cfg.max)return{k:'ok',h:'In range',m:'Total time is right on target.'};
  if(t<=cfg.max+8)return{k:'slow',h:'A little slow',m:'Slightly over the target range.'};
  return{k:'slow',h:'Very slow',m:'Runs far too long — likely over-extracted (bitter, harsh, dry finish).'};
}
function step(dir,n){
  const s=(dir==='finer')===cfg.lowFine?-n:n;
  const g=Math.min(25,Math.max(1,shot.grind+s));
  return g===shot.grind?null:g;
}
function timeSuggestion(){
  const t=shot.time;
  if(shot.status==='ok')return null;
  const dir=shot.status==='fast'?'finer':'coarser';
  const far=t<cfg.min-8||t>cfg.max+8;
  const g=step(dir,far?2:1);
  return{dir,g,html:g?`<b>Try grind ${g}</b> next (${dir}, from ${shot.grind}).`:`Already at the ${dir==='finer'?'finest':'coarsest'} setting — adjust dose/tamp or beans instead.`};
}
function finish(){
  shot.pre=+((shot.t1-shot.t0)/1000).toFixed(1);
  shot.ext=+((shot.t2-shot.t1)/1000).toFixed(1);
  shot.time=+((shot.t2-shot.t0)/1000).toFixed(1);
  shot.ts=new Date().toISOString();
  const c=classify(shot.time);shot.status=c.k;
  shot.sug=timeSuggestion();
  const sug=shot.sug?`<div class="sug">${shot.sug.html}<div class="note">${BARISTA}</div></div>`:'';
  $('verdict').innerHTML=`<h3>${shot.time.toFixed(1)}s total</h3><span class="tag">${c.h}</span> <span class="tag">${shot.type} · ${shot.size}</span> <span class="tag">Grind ${shot.grind}</span> <span class="tag">${dots(shot.strength)} ${ratioTxt(shot.strength)}</span> <span class="tag">Wait ${shot.pre.toFixed(1)}s · pour ${shot.ext.toFixed(1)}s</span><p>${c.m} Target ${cfg.min}–${cfg.max}s.</p>${sug}`;
  show('vResult');
}
function advise(taste){
  const c=shot.status;let dir=null,n=1,txt='';
  const far=shot.time<cfg.min-8||shot.time>cfg.max+8;
  if(taste==='sour'||(!taste&&c==='fast')){dir='finer';n=far?2:1;}
  else if(taste==='bitter'||(!taste&&c==='slow')){dir='coarser';n=far?2:1;}
  else if(taste==='weak'){dir='finer';n=1;}
  if(dir){const g=step(dir,n);
    txt=g?`Go <b>${dir}</b>: try grind <b>${g}</b> (from ${shot.grind}).`:`Already at the ${dir==='finer'?'finest':'coarsest'} setting — adjust dose/tamp or beans instead.`;
    txt+=c==='ok'?` Time was in range, so the taste notes suggest a small tweak.`:` Total time was ${shot.time.toFixed(1)}s.`;
  } else txt=`Time was in range, so grind probably isn't the issue. Choose what was wrong below, or check bean freshness, dose and tamp.`;
  if(shot.strength===1&&taste==='weak')txt+=` You're on ● (4 : 1), so a higher strength setting may also help.`;
  shot.advice=txt.replace(/<[^>]+>/g,'');shot.taste=taste||null;
  $('advice').innerHTML=`<h3>Suggestion</h3>${txt}<div class="note" style="margin-top:10px">${BARISTA}</div>`;
}
$('good').onclick=()=>{shot.result='good';
  let extra='';
  if(shot.sug){shot.advice=shot.sug.html.replace(/<[^>]+>/g,'');extra=`<div class="sug">Time was outside ${cfg.min}–${cfg.max}s. ${shot.sug.html}</div>`;}
  $('advice').innerHTML=`<h3>Nice</h3>Grind ${shot.grind}, ${dots(shot.strength)} at ${shot.time.toFixed(1)}s.${extra}`;
  $('tasteQ').classList.add('hide');show('vAdvice');};
$('bad').onclick=()=>{shot.result='bad';
  advise(null);
  $('tasteQ').classList.toggle('hide',shot.status!=='ok');
  show('vAdvice');};
['sour','bitter','weak'].forEach(k=>$(k).onclick=()=>advise(k));
$('done').onclick=()=>{
  log.unshift({ts:shot.ts,type:shot.type,grind:shot.grind,size:shot.size,strength:shot.strength,ratio:RATIO[shot.strength],pre:shot.pre,ext:shot.ext,time:shot.time,result:shot.result,advice:shot.advice||'',taste:shot.taste||''});
  store.set('log',log);
  if(shot.advice&&shot.result==='bad'){const m=shot.advice.match(/grind (\d+)/);if(m){grind=+m[1];store.set('grind',grind)}}
  setup();show('vSetup');
};

function hist(){
  $('tMin').value=cfg.min;$('tMax').value=cfg.max;
  $('dirLow').classList.toggle('on',cfg.lowFine);$('dirHigh').classList.toggle('on',!cfg.lowFine);
  $('list').innerHTML=log.length?log.map(l=>{const d=new Date(l.ts);
    return`<div class="row"><div>${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}<small>${l.type?l.type+' · ':''}${l.size} · Grind ${l.grind}${l.strength?' · '+dots(l.strength):''}</small></div><div class="r">${l.time.toFixed(1)}s<small>${l.result==='good'?'👍 Good':'👎 Bad'}${l.taste?' · '+l.taste:''}</small></div></div>`}).join(''):'<div class="sub">No shots yet</div>';
  show('vHist');
}
$('navBtn').onclick=()=>{$('vHist').classList.contains('hide')?hist():(setup(),show('vSetup'))};
function saveCfg(){cfg.min=+$('tMin').value||24;cfg.max=+$('tMax').value||32;store.set('cfg2',cfg)}
$('tMin').onchange=$('tMax').onchange=saveCfg;
$('dirLow').onclick=()=>{cfg.lowFine=true;store.set('cfg2',cfg);hist()};
$('dirHigh').onclick=()=>{cfg.lowFine=false;store.set('cfg2',cfg);hist()};
$('clear').onclick=()=>{if(confirm('Delete all history?')){log=[];store.set('log',log);hist()}};
$('csv').onclick=()=>{const r=[['timestamp','coffee','size','grind','strength','ratio_out_per_in','wait_s','pour_s','total_s','result','taste','advice'],...log.map(l=>[l.ts,l.type||'',l.size,l.grind,l.strength||'',l.ratio||'',l.pre,l.ext??'',l.time,l.result,l.taste,'"'+l.advice+'"'])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.join(',')).join('\n')],{type:'text/csv'}));a.download='shots.csv';a.click();};

setup();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(navigator.wakeLock)document.addEventListener('click',()=>navigator.wakeLock.request('screen').catch(()=>{}),{once:true});
</script>
</body>
</html>
